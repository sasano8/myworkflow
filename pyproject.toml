[build-system]
requires = ["setuptools>=80"]
build-backend = "setuptools.build_meta"

[project]
name = "myworkflow"
version = "0.1.0"
description = "Executable-contract declarations and reproducible business documentation"
requires-python = ">=3.14"

[project.optional-dependencies]
temporal = ["temporalio==1.35.0"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.setuptools.packages.find]
include = ["myworkflow*"]
