[build-system]
requires = ["setuptools>=80"]
build-backend = "setuptools.build_meta"

[project]
name = "myworkflow"
version = "0.1.0"
description = "Executable-contract declarations and reproducible business documentation"
requires-python = ">=3.14"
dependencies = ["pydantic==2.12.5"]

[project.scripts]
myworkflow = "myworkflow.cli:main"

[project.optional-dependencies]
test = ["pytest==9.2.0", "pytest-asyncio==1.4.1"]
quality = ["coverage[toml]==7.17.0", "radon==6.0.1"]
temporal = ["temporalio==1.35.0"]
acceptance = ["pytest==9.2.0", "pytest-bdd==9.0.1", "gherkin-official==42.0.1"]

[tool.pytest.ini_options]
addopts = ["--import-mode=importlib"]
testpaths = ["tests"]
norecursedirs = [".*", "__pycache__", "*.egg-info", "dist"]

[tool.setuptools.packages.find]
include = ["myworkflow*"]

[tool.coverage.run]
branch = true
source = ["myworkflow"]
relative_files = true
patch = ["subprocess"]

[tool.coverage.report]
precision = 2
show_missing = true
