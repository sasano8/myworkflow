name: code-quality
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  metrics:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v6
        with:
          python-version: '3.14'
      - run: python -m pip install '.[test,acceptance,quality]'
      - name: Measure test coverage and source complexity
        run: python -m myworkflow.quality.code_metrics
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: code-quality
          path: artifacts/code-quality/
          include-hidden-files: true
          if-no-files-found: warn
