name: contracts
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v6
        with:
          python-version: '3.14'
      - name: Test contracts and sample snapshot
        run: python -m unittest discover -s tests -v
      - name: Verify generated sample
        run: |
          python -m examples.approval > /tmp/approval.md
          diff -u examples/approval.md /tmp/approval.md
