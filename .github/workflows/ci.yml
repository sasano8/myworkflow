name: contracts
on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      temporal:
        description: Run optional Temporal integration tests
        type: boolean
        default: false
permissions:
  contents: read
jobs:
  requirements:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v6
        with:
          python-version: '3.14'
      - run: python -m pip install --no-deps .
      - name: Check requirement coverage and generated interfaces
        run: python -m myworkflow.quality --case examples/purchase/quality/case.json --output artifacts/requirement-roundtrip
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: requirement-roundtrip
          path: artifacts/requirement-roundtrip/
          if-no-files-found: warn
  core:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v6
        with:
          python-version: '3.14'
      - name: Install only the core and pytest in a clean environment
        run: |
          python -m venv /tmp/core-env
          /tmp/core-env/bin/python -m pip install . 'pytest==9.2.0'
          /tmp/core-env/bin/python -c "import importlib.util; assert importlib.util.find_spec('pytest_bdd') is None"
      - name: Verify core without BDD or Temporal
        run: /tmp/core-env/bin/python -m pytest tests/test_contracts.py tests/test_executable.py tests/test_refactoring.py tests/test_quality.py tests/test_state_graph.py tests/test_declarations.py -q
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v6
        with:
          python-version: '3.14'
      - name: Install library
        run: python -m pip install '.[acceptance]'
      - name: Test contracts, runtime, faults and generation
        run: python -W error::ResourceWarning -m pytest -q --acceptance-report artifacts/acceptance.json
      - name: Verify generated samples
        run: |
          python -m examples.declarative_review > /tmp/declarative-review.md
          diff -u examples/declarative_review.md /tmp/declarative-review.md
          python -m examples.purchase --docs > /tmp/purchase.md
          diff -u examples/purchase/requirements.md /tmp/purchase.md
          python -m examples.purchase.acceptance docs --check
          python -m myworkflow.acceptance --config examples.tickets.acceptance.catalog docs --check
      - name: Run purchase flow
        run: python -m examples.purchase
      - name: Render acceptance results
        if: always()
        run: |
          if test -f artifacts/acceptance.json; then
            python -m examples.purchase.acceptance report artifacts/acceptance.json > artifacts/acceptance.md
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: purchase-acceptance
          path: artifacts/
          if-no-files-found: warn
  temporal:
    if: github.event_name == 'workflow_dispatch' && inputs.temporal
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v6
        with:
          python-version: '3.14'
      - run: python -m pip install '.[acceptance,temporal]'
      - run: bash scripts/install-temporal-cli.sh /tmp/myworkflow-temporal
      - name: Run Temporal integration tests
        env:
          TEMPORAL_CLI_PATH: /tmp/myworkflow-temporal/temporal
        run: python -m unittest discover -s integration -v
      - name: Run purchase acceptance scenarios with Temporal enabled
        env:
          RUN_TEMPORAL_ACCEPTANCE: '1'
          TEMPORAL_CLI_PATH: /tmp/myworkflow-temporal/temporal
        run: python -m pytest tests/acceptance -q --acceptance-report artifacts/temporal-acceptance.json
      - name: Render Temporal acceptance results
        if: always()
        run: |
          if test -f artifacts/temporal-acceptance.json; then
            python -m examples.purchase.acceptance report artifacts/temporal-acceptance.json > artifacts/temporal-acceptance.md
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: purchase-acceptance-temporal
          path: artifacts/
          if-no-files-found: warn
